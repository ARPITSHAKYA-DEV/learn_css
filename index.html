<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css level 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

</body>
<div>
    <form action="/action.pngp">
        <div>
        <p>Personal Information</p>
        <label for="first">First Name:</label>
        <input type="text" id="first" placeholder="enter first name"><br><br>
        <label for="last">Last Name:</label>
        <input type="text" id="last" placeholder="enter last name"><br><br>
        <label for="age">Age:</label>
        <input type="date" name="date" id="age"><br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="enter your email"><br><br>
        <label for="mobile">Mobile:</label>
        <input type="number" id="mobile" placeholder="enter your mobile number"><br>
        <h3>select your gender:</h3>
        <label for="g">female</label>
        <input type="radio" name="gender" id="g">
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender">
        <label for="t">trans</label>
        <input type="radio" id="t" name="gender">
    </div>
    <h3>Select your course:</h3>
       <select name="course" id="course">
       <option value="Btech(cse)">Btech(cse)</option>
       <option value="btech(Ai&ml)">Btech()Ai&Ml</option>
       <option value="btech">Mechenical enginnering</option>
       <option value="btech">Chemical enginnering</option>
       </select>
    <div>
        <div>
            <h3>Choose your subject :</h3>
            <label for="dsa">DSA</label>
            <input type="checkbox" name="subject" id="dsa">
            <label for="htlm">HTML</label>
            <input type="checkbox" name="subject" id="html">
            <label for="css">CSS</label>
            <input type="checkbox" name="subject" id="css">
            <label for="js">java script</label>
            <input type="checkbox" name="subject" id="js">
        </div>
        <div>
            <table border="2px">
                <tr>
                    <th>Class</th>
                    <th>School Name</th>
                    <th>Marks in 10th(%)</th>
                    <th>Passing year</th>
                    <th>Marks in 12th(%)</th>
                    <th>Passing year</th>
                </tr>
                <tr>
                    <td>10th</td>
                    <td>balaji global academy</td>
                    <td>86%</td>
                    <td>2021</td>
                    <td>70%</td>
                    <td>2023</td>

                </tr>
            </table>
            <label for="feedback">feedback:</label><br>
            <textarea name="feedback" id="feedback"></textarea>
        </div>

    </div>
    <pre>
        <button type="reset">erase or fill again</button>        <button type="submit">submit your data</button>
        
        
        
        <button type="button">click me</button>
    </pre>
    
    
         



    </form>
    
</div>

</body>

</html>
